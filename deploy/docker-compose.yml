# Production stack for Watch Together — fronted by a Cloudflare Tunnel.
#
# Lives at /opt/watch-together/ on the deployment host. Nothing is published
# to the host: cloudflared handles ingress and proxies to nginx:80 over the
# internal bridge, and nginx routes to the frontend and backend.
#
# Differences from the repo-root compose, which is for local development:
#   - No source bind mounts. Both images contain their own code, so a deploy
#     is a rebuild rather than a file copy, and the running container cannot
#     be changed by editing files on the host.
#   - Backend data lives in a named volume, so the SQLite database and the
#     segment cache survive rebuilds. Cookies are never on it: they live in
#     the backend's memory while the extension keeps refreshing them.
#   - Every container resolves DNS over HTTPS through the `dns` service.
#   - Nothing binds a host port.

name: watch-together

# Every container resolves external names through the `dns` service below,
# which forwards them to Cloudflare over DNS-over-HTTPS. Docker's embedded
# DNS still answers container names itself and only forwards the rest, so
# no plaintext DNS query leaves the stack. The address must lie inside the
# network's subnet (WT_SUBNET); override both together if the default range
# collides with something on the host.
x-doh-resolver: &doh_resolver
  - ${WT_DNS_IP:-172.28.0.53}

services:
  backend:
    build:
      context: ../backend
    image: watch-together/backend:latest
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - bgutil-provider
    environment:
      BGUTIL_YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      EXTENSION_SOURCE_DIR: /app/extension
      # Never enable in production: it lets ?user= set any identity.
      DEVELOPMENT_MODE: "false"
      # Verified identities allowed to use /api/admin. Empty disables the
      # admin panel entirely.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${WT_HOST:?required}}
      # Verify Cloudflare Access assertions rather than trusting the plain
      # identity header, which anyone reaching the origin directly can send.
      # Setting both also turns REQUIRE_AUTHENTICATION on by default.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      REQUIRE_AUTHENTICATION: ${REQUIRE_AUTHENTICATION:-}
      # Room state, caches and the rate limiter are in process memory, so a
      # second worker would split rooms. Startup refuses anything above 1.
      WEB_CONCURRENCY: "1"
      # Fetch the latest yt-dlp nightly on every start. YouTube breaks
      # extraction often and the fix usually ships within days, so a version
      # frozen at image build time goes stale quickly. Set to "false" to pin.
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-true}
      # DEBUG adds a line per proxied transfer with the byte range the origin
      # saw, which is what distinguishes a player's range request from an
      # intermediary fetching the whole object.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Segment cache budget, in GB. Once it is reached nothing new is cached
      # until the janitor evicts, so a budget smaller than a viewing session
      # turns caching off partway through. Raise it on a host with room.
      MAX_CACHE_SIZE_GB: ${MAX_CACHE_SIZE_GB:-4}
    volumes:
      # SQLite database and the segment cache. Cookies are never on it.
      - backend_data:/app/data
      # The extension source, packaged on demand for members to download.
      - ../extension:/app/extension:ro
    networks: [ watch_net ]
    expose: [ "8000" ]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  bgutil-provider:
    # Solves YouTube BotGuard challenges so yt-dlp can obtain PO tokens.
    image: brainicism/bgutil-ytdlp-pot-provider:0.7.2
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
    networks: [ watch_net ]
    expose: [ "4416" ]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  frontend:
    build:
      context: ../frontend
    image: watch-together/frontend:latest
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - backend
    environment:
      # Server-side rendering reaches the backend over the internal network.
      BACKEND_URL: http://backend:8000
    networks: [ watch_net ]
    expose: [ "3000" ]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - frontend
      - backend
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      watch_net:
        # watch-together-proxy is the name the earlier stack used, and a
        # tunnel's public hostname may still point at it. Keeping it as an
        # alias means the Cloudflare side needs no change.
        aliases: [ nginx, proxy, watch-together-proxy ]
    expose: [ "80" ]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  dns:
    # DNS-over-HTTPS resolver for the whole stack (see x-doh-resolver).
    # AdGuard's dnsproxy listens on port 53 and carries every query to
    # Cloudflare over HTTPS; it reaches 1.1.1.1 by address, so it needs no
    # resolver of its own. Pinned, not `latest`: cloudflared's proxy-dns
    # disappeared in 2026.2.0 and a floating tag crash-looped the stack.
    image: adguard/dnsproxy:v0.84.2
    restart: unless-stopped
    command: -l 0.0.0.0 -p 53 -u https://1.1.1.1/dns-query -u https://1.0.0.1/dns-query
    networks:
      watch_net:
        ipv4_address: ${WT_DNS_IP:-172.28.0.53}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - nginx
    # Transport for the tunnel. QUIC recovers from loss far better than
    # HTTP/2 over a long-haul path, which matters when the viewer is a
    # continent away from the origin; http2 is the fallback for hosts whose
    # UDP egress is blocked. `auto` lets cloudflared try QUIC and fall back.
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?required}
    networks: [ watch_net ]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  watch_net:
    name: watch_net
    ipam:
      config:
        - subnet: ${WT_SUBNET:-172.28.0.0/24}

volumes:
  backend_data:
