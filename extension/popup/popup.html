<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Together Cookie Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
                    <rect width="64" height="64" rx="15" fill="#15161a"/>
                    <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
                    <path d="M17 15.5v23a2.5 2.5 0 0 0 3.8 2.1l18.4-11.5a2.5 2.5 0 0 0 0-4.2L20.8 13.4A2.5 2.5 0 0 0 17 15.5Z" fill="#d93a3a" fill-opacity=".45"/>
                    <path d="M24 25.5v23a2.5 2.5 0 0 0 3.8 2.1l18.4-11.5a2.5 2.5 0 0 0 0-4.2L27.8 23.4A2.5 2.5 0 0 0 24 25.5Z" fill="#e4605f"/>
                </svg>
                <span>Watch Together</span>
            </div>
        </header>

        <div class="status-card" id="statusCard">
            <div class="status-indicator" id="statusIndicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Checking...</span>
            </div>
            <div class="user-email" id="userEmail"></div>
            <!-- Shown when the open tab looks like a Watch Together instance
                 that has not been granted access yet. A self-hosted instance
                 has its own domain, so permission is asked for per site. -->
            <button class="btn btn-primary" id="connectBtn" hidden>
                Connect this site
            </button>
            <div class="send-status" id="connectStatus"></div>
        </div>

        <div class="sync-section">
            <div class="sync-info">
                <span class="label">Last Sync</span>
                <span class="value" id="lastSync">Never</span>
            </div>
            <button class="btn btn-primary" id="syncBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Sync Now
            </button>
        </div>

        <div class="send-section" id="sendSection">
            <div class="send-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22,2 15,22 11,13 2,9"/>
                </svg>
                <span>Send to Watch Together</span>
            </div>
            <div class="room-input">
                <input type="text" id="roomId" placeholder="Room ID (e.g., movie-night)" />
                <button class="btn btn-send" id="sendBtn" title="Queue current page">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="send-status" id="sendStatus"></div>
        </div>

        <div class="domains-section">
            <div class="section-header">
                <span>Synced Domains</span>
                <span class="domain-count" id="domainCount">0</span>
            </div>
            <div class="domain-list" id="domainList"></div>
        </div>

        <footer>
            <label class="toggle">
                <input type="checkbox" id="autoSyncToggle" checked>
                <span class="toggle-label">Auto-sync every 10 min</span>
            </label>
            <button class="btn btn-link" id="optionsBtn">Settings</button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
