name: Browser Extension Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

# The rolling `nightly` prerelease and its assets are rewritten on every main
# commit. No package is published anywhere else.
permissions:
  contents: write

concurrency:
  group: chrome-extension-nightly
  cancel-in-progress: true

jobs:
  package:
    name: Package the browser extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate extension source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("extension/manifest.json").read_text())
          assert manifest["manifest_version"] == 3, "Chrome package must use Manifest V3"
          assert manifest["background"]["service_worker"] == "background.js"
          print("Chrome extension version:", manifest["version"])
          PY

          found=0
          while IFS= read -r script; do
            node --check "$script"
            found=$((found + 1))
          done < <(find extension -name '*.js' -not -path '*/lib/*' | sort)
          test "$found" -gt 0

      - name: Build extension ZIPs
        run: |
          rm -rf dist
          mkdir -p dist
          # The same packager the backend uses for /api/extension/download,
          # so the release and the in-app download cannot drift apart.
          python backend/services/extension_package.py \
            --source extension --browser chrome \
            --output dist/watch-together-chrome-nightly.zip --checksum
          python backend/services/extension_package.py \
            --source extension --browser firefox \
            --output dist/watch-together-firefox-nightly.zip --checksum

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("extension/manifest.json").read_text())
          Path("dist/release-notes.md").write_text(
              "Automated browser extension build from the latest `main` commit.\n\n"
              f"- Extension version: `{manifest['version']}`\n"
              f"- Commit: `{os.environ['GITHUB_SHA']}`\n\n"
              "Chrome / Edge: download `watch-together-chrome-nightly.zip`, extract it, then load the "
              "directory from `chrome://extensions` with Developer mode enabled.\n"
              "Firefox: download `watch-together-firefox-nightly.zip` and load it from "
              "`about:debugging#/runtime/this-firefox` with \"Load Temporary Add-on\".\n"
          )
          PY

          for archive in dist/*.zip; do
            unzip -t "$archive"
            unzip -p "$archive" manifest.json | python -m json.tool >/dev/null
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: watch-together-chrome-nightly
          path: |
            dist/watch-together-chrome-nightly.zip
            dist/watch-together-chrome-nightly.zip.sha256
            dist/watch-together-firefox-nightly.zip
            dist/watch-together-firefox-nightly.zip.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Update rolling Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is deliberately movable: this is one rolling prerelease,
          # not an unbounded permanent release for every commit.
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Browser Extension Nightly" \
              --notes-file dist/release-notes.md \
              --prerelease
            gh release upload nightly \
              dist/watch-together-chrome-nightly.zip \
              dist/watch-together-chrome-nightly.zip.sha256 \
              dist/watch-together-firefox-nightly.zip \
              dist/watch-together-firefox-nightly.zip.sha256 \
              --clobber
          else
            gh release create nightly \
              dist/watch-together-chrome-nightly.zip \
              dist/watch-together-chrome-nightly.zip.sha256 \
              dist/watch-together-firefox-nightly.zip \
              dist/watch-together-firefox-nightly.zip.sha256 \
              --title "Browser Extension Nightly" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
