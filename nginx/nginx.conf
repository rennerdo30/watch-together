events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Timings on every media request, so a stall can be attributed instead of
    # guessed at. upstream_response_time is how long the backend (and through
    # it the CDN) took; request_time includes delivery to the viewer, so the
    # gap between them is the trip to the client.
    # `ua` and `ref` are here because a transfer with no Range header pulls a
    # whole rendition — 117 MB was observed — and the other fields cannot say
    # which client asked for it.
    log_format media '$status $body_bytes_sent bytes '
                     'request=$request_time upstream=$upstream_response_time '
                     'range="$http_range" cr="$sent_http_content_range" '
                     'ua="$http_user_agent" ref="$http_referer" '
                     '"$request_uri"';

    # `keepalive` is what actually pools connections. Setting
    # `proxy_set_header Connection ""` alone is not enough: without a
    # keepalive directive nginx opens a fresh TCP connection to the upstream
    # for every request, and adaptive playback is thousands of them.
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: ws: https:; font-src 'self' data:; frame-ancestors 'self';" always;

        # WebSocket Proxy
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket timeout - keep connections alive for long sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Video Proxy - needs longer timeouts and streaming config
        location /api/proxy {
            access_log /var/log/nginx/access.log media;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Keep-alive to the backend. This was "close" to work around
            # HTTP/2 stream errors that actually came from partial responses
            # missing a Content-Range; with that fixed, closing per response
            # only adds a connection setup to every segment.
            proxy_set_header Connection "";

            # Buffering is ON for media, which is the opposite of the usual
            # streaming advice and deliberate here. Responses are bounded byte
            # ranges, not open-ended streams. With buffering off, nginx writes
            # at the viewer's pace, so a segment the origin serves in 74ms
            # keeps the backend task and its upstream connection pinned for
            # the seconds it takes to reach a viewer on another continent —
            # and the player has several such fetches in flight at once. With
            # buffering on, nginx drains the segment at LAN speed, releases
            # the backend and the CDN connection immediately, then feeds the
            # viewer from its own memory.
            proxy_buffering on;
            proxy_buffers 64 64k;
            proxy_buffer_size 64k;
            proxy_busy_buffers_size 512k;
            # Keep spillover in memory rather than on disk; segments are well
            # under the 4MB of buffers above.
            proxy_max_temp_file_size 0;
            proxy_request_buffering off;

            # Disable chunked encoding to improve compatibility
            chunked_transfer_encoding off;

            # Long timeouts for large video files
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Handle large files
            client_max_body_size 0;

            # Disable gzip for video to avoid buffering
            gzip off;
        }

        # API Proxy (other endpoints)
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass through X-Forwarded-Proto from upstream (Cloudflare), default to https
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Fail fast if backend is overloaded/frozen (frees up browser connection pool)
            proxy_connect_timeout 15s;
            proxy_read_timeout 20s;
        }

        # Frontend Proxy (Catch-all)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support for Next.js HMR (Hot Module Replacement) if valid
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
