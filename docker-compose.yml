# Every container resolves external names through the `dns` service below,
# which forwards them to Cloudflare over DNS-over-HTTPS. Docker's embedded
# DNS still answers container names itself and only forwards the rest, so
# no plaintext DNS query leaves the stack. The address must lie inside the
# network's subnet (WT_SUBNET); override both together if the default range
# collides with something on the host.
x-doh-resolver: &doh_resolver
  - ${WT_DNS_IP:-172.28.0.53}

services:
  backend:
    build: ./backend
    container_name: watch-together-backend
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      # The extension source, packaged on demand for members to download.
      - ./extension:/app/extension:ro
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
    networks:
      - watch-network
    environment:
      - BGUTIL_YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
      - EXTENSION_SOURCE_DIR=/app/extension
      - DEVELOPMENT_MODE=${DEVELOPMENT_MODE:-false}
      # Verified identities allowed to use /api/admin. Empty disables it.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Set both to verify Cloudflare Access assertions instead of trusting
      # the identity header. Without them the header is accepted as-is.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      # Defaults to on when Cloudflare Access is configured.
      - REQUIRE_AUTHENTICATION=${REQUIRE_AUTHENTICATION:-}
      # The shared browser. Off unless both a password and a media path are
      # configured; see deploy/README.md.
      - BROWSER_ENABLED=${BROWSER_ENABLED:-false}
      - BROWSER_USER_PASSWORD=${BROWSER_USER_PASSWORD:-}
      - BROWSER_ADMIN_PASSWORD=${BROWSER_ADMIN_PASSWORD:-}
      - BROWSER_PUBLIC_IP=${BROWSER_PUBLIC_IP:-}
      - BROWSER_UDP_PORTS=${BROWSER_UDP_PORTS:-}
      - BROWSER_SESSION_COOKIE_SECURE=${BROWSER_SESSION_COOKIE_SECURE:-true}
      - WEBRTC_TURN_URL=${WEBRTC_TURN_URL:-}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-}
      - WEBRTC_TURN_CREDENTIAL=${WEBRTC_TURN_CREDENTIAL:-}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:0.7.2
    container_name: bgutil-provider
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
    expose:
      - "4416"
    networks:
      - watch-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  frontend:
    build: ./frontend
    container_name: watch-together-frontend
    expose:
      - "3000"
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - backend
    networks:
      - watch-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  nginx:
    image: nginx:1.27-alpine
    container_name: watch-together-proxy
    ports:
      # Bound to loopback by default: the tunnel reaches nginx over the
      # docker network, so nothing needs to be reachable from the LAN.
      # Set NGINX_BIND=0.0.0.0 to publish it (for an external reverse
      # proxy on another host, or direct LAN access).
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
      - frontend
      - backend
    networks:
      watch-network:
        aliases:
          - nginx
          - proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # A real browser on the server, streamed to the room over WebRTC, with
  # whoever holds control typing into it. Opt-in: `docker compose
  # --profile browser up -d`, and only after arranging a path for its media
  # (see deploy/README.md — nothing else in this stack needs one).
  neko:
    image: ghcr.io/m1k1o/neko/chromium:3.1.5
    container_name: watch-together-browser
    profiles: [ browser ]
    restart: unless-stopped
    dns: *doh_resolver
    depends_on:
      - dns
    expose:
      - "8080"
    networks:
      - watch-network
    # Chromium puts its renderer shared memory here; the container default of
    # 64 MB makes tabs crash on anything with pictures in it.
    shm_size: 2gb
    environment:
      # Served under a prefix, beside the app rather than on its own host.
      # Three places have to agree on it: this, the nginx `location`, and
      # BROWSER_PATH_PREFIX in backend/core/config.py.
      - NEKO_SERVER_PATH_PREFIX=/neko
      - NEKO_SERVER_PROXY=true
      - NEKO_DESKTOP_SCREEN=${BROWSER_SCREEN:-1920x1080@30}
      # Logins are made by the backend over the internal network; the
      # passwords never reach a browser. Members are handed the resulting
      # session cookie instead.
      - NEKO_MEMBER_PROVIDER=multiuser
      - NEKO_MEMBER_MULTIUSER_USER_PASSWORD=${BROWSER_USER_PASSWORD:-}
      - NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD=${BROWSER_ADMIN_PASSWORD:-}
      - NEKO_SESSION_COOKIE_ENABLED=true
      - NEKO_SESSION_COOKIE_NAME=NEKO_SESSION
      - NEKO_SESSION_COOKIE_PATH=/neko
      - NEKO_SESSION_COOKIE_SECURE=${BROWSER_SESSION_COOKIE_SECURE:-true}
      # --- how the picture gets out -----------------------------------
      # Either a UDP range published on the host with this address
      # announced as a candidate, or a TURN relay both ends can reach.
      # With neither set the backend reports the feature as unavailable
      # and the room says so instead of offering a button.
      - NEKO_WEBRTC_EPR=${BROWSER_UDP_PORTS:-}
      - NEKO_WEBRTC_NAT1TO1=${BROWSER_PUBLIC_IP:-}
      - NEKO_WEBRTC_ICESERVERS_FRONTEND=${BROWSER_ICE_SERVERS:-}
      - NEKO_WEBRTC_ICESERVERS_BACKEND=${BROWSER_ICE_SERVERS:-}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'

  dns:
    # DNS-over-HTTPS resolver for the whole stack (see x-doh-resolver).
    # AdGuard's dnsproxy listens on port 53 and carries every query to
    # Cloudflare over HTTPS; it reaches 1.1.1.1 by address, so it needs no
    # resolver of its own. Pinned, not `latest`: cloudflared's proxy-dns
    # disappeared in 2026.2.0 and a floating tag crash-looped the stack.
    image: adguard/dnsproxy:v0.84.2
    container_name: watch-together-dns
    restart: unless-stopped
    command: -l 0.0.0.0 -p 53 -u https://1.1.1.1/dns-query -u https://1.0.0.1/dns-query
    networks:
      watch-network:
        ipv4_address: ${WT_DNS_IP:-172.28.0.53}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: watch-together-tunnel
    restart: unless-stopped
    dns: *doh_resolver
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - dns
      - nginx
    networks:
      - watch-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  backend-data:


networks:
  watch-network:
    ipam:
      config:
        - subnet: ${WT_SUBNET:-172.28.0.0/24}
